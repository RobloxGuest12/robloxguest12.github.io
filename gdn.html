<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Need a Graphic Designer</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #111, #1a1a1a);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }

    .container {
        max-width: 900px;
        padding: 40px;
        background: rgba(255,255,255,0.05);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #ff4d4d, #ffcc00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    p {
        font-size: 1.2rem;
        opacity: 0.8;
    }

    img {
        margin-top: 30px;
        max-width: 100%;
        border-radius: 15px;
        box-shadow: 0 0 25px rgba(255, 77, 77, 0.6);
    }

    .btn {
        margin-top: 30px;
        padding: 15px 40px;
        font-size: 1.1rem;
        border: none;
        border-radius: 50px;
        background: #ff4d4d;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #ffcc00;
        color: black;
        transform: scale(1.05);
    }
</style>
</head>

<body>

<div class="container">
    <h1>I Need a Graphic Designer</h1>
    <p>This startup has zero design skill points. Please send help.</p>

    <!-- YOUR IMAGE ENTERS THE CHAT -->
    <img src="https://u.cubeupload.com/Pixel/Screenshot2026021320.png" alt="I Need a Graphic Designer">

    <br>
    <button class="btn" onclick="alert('Congratulations. You are hired. mango mango mustard 6 7 6 7')">
        Apply Now
    </button>
</div>

</body>
</html>
