<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scratch Forum WYSIWYG Editor</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #1e1e1e;
  color: white;
  margin: 0;
  padding: 0;
}

.toolbar {
  background: #2a2a2a;
  padding: 10px;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

button {
  padding: 6px 10px;
  border: none;
  background: #ff8c1a;
  color: white;
  cursor: pointer;
  border-radius: 4px;
  font-weight: bold;
}

button:hover {
  opacity: 0.8;
}

#editor {
  min-height: 250px;
  padding: 15px;
  outline: none;
  background: #121212;
  border-top: 2px solid #333;
}

#bbcodeOutput {
  width: 100%;
  height: 150px;
  background: #0f0f0f;
  color: #00ff99;
  border: none;
  padding: 10px;
  font-family: monospace;
}

blockquote {
  border-left: 4px solid orange;
  margin: 5px 0;
  padding-left: 10px;
  color: #ccc;
}

code {
  background: #000;
  padding: 3px 6px;
  border-radius: 4px;
  color: #00ff99;
}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="format('bold')">Bold</button>
  <button onclick="format('italic')">Italic</button>
  <button onclick="format('underline')">Underline</button>
  <button onclick="insertLink()">Link</button>
  <button onclick="insertQuote()">Quote</button>
  <button onclick="insertCode()">Code</button>
  <button onclick="copyBBCode()">Copy BBCode</button>
</div>

<div id="editor" contenteditable="true" oninput="updateBBCode()">
Type your Scratch forum post here...
</div>

<textarea id="bbcodeOutput" readonly></textarea>

<script>
function format(command) {
  document.execCommand(command, false, null);
  updateBBCode();
}

function insertLink() {
  let url = prompt("Enter URL:");
  if (url) {
    document.execCommand("createLink", false, url);
    updateBBCode();
  }
}

function insertQuote() {
  document.execCommand("formatBlock", false, "blockquote");
  updateBBCode();
}

function insertCode() {
  let selection = window.getSelection();
  let range = selection.getRangeAt(0);
  let code = document.createElement("code");
  code.textContent = selection.toString();
  range.deleteContents();
  range.insertNode(code);
  updateBBCode();
}

function htmlToBBCode(html) {
  return html
    .replace(/<b>|<strong>/g, "[b]")
    .replace(/<\/b>|<\/strong>/g, "[/b]")
    .replace(/<i>|<em>/g, "[i]")
    .replace(/<\/i>|<\/em>/g, "[/i]")
    .replace(/<u>/g, "[u]")
    .replace(/<\/u>/g, "[/u]")
    .replace(/<blockquote>/g, "[quote]")
    .replace(/<\/blockquote>/g, "[/quote]")
    .replace(/<code>/g, "[code]")
    .replace(/<\/code>/g, "[/code]")
    .replace(/<a href="(.*?)".*?>(.*?)<\/a>/g, "[url=$1]$2[/url]")
    .replace(/<div>/g, "")
    .replace(/<\/div>/g, "\n")
    .replace(/<br>/g, "\n")
    .replace(/&nbsp;/g, " ")
    .replace(/<[^>]+>/g, "");
}

function updateBBCode() {
  let html = document.getElementById("editor").innerHTML;
  document.getElementById("bbcodeOutput").value = htmlToBBCode(html);
}

function copyBBCode() {
  let textarea = document.getElementById("bbcodeOutput");
  textarea.select();
  document.execCommand("copy");
  alert("BBCode copied!");
}

updateBBCode();
</script>

</body>
</html>
